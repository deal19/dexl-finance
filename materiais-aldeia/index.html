<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Materiais Aldeia</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#718096;--line:#e7ebef;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;min-height:100dvh}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{width:min(560px,100%);margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.header{padding:8px 2px 14px}
.title{font-size:28px;font-weight:900;letter-spacing:-.8px}.subtitle{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f9fa;border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:25px;margin-top:4px}
.actions{display:grid;gap:10px;margin-top:14px}button{border:0;border-radius:15px;padding:16px;font-weight:800;min-height:52px;cursor:pointer}.green{background:var(--green);color:white}.blue{background:var(--blue);color:white}.gray{background:#edf1f4;color:#26323d}
.section-title{font-size:16px;font-weight:900}.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px}.name{min-width:0}.name strong{display:block;white-space:normal}.name small{color:var(--muted);display:block;margin-top:2px}.stock{font-size:17px;font-weight:900;white-space:nowrap}.ok{color:var(--green)}.zero{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding-top:20px}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.18)}
.sheet h2{margin:0 0 12px;font-size:22px}.close{float:right;background:#edf1f4;width:42px;height:42px;min-height:42px;padding:0;border-radius:50%}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}.field{width:100%;height:52px;padding:0 14px;border:1px solid #d7dee5;border-radius:13px;background:#fff;color:var(--text);outline:none;font-size:16px}.field:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.qty{display:flex;align-items:center;gap:14px;margin:8px 0 18px}.qty button{width:52px;height:52px;min-height:52px;padding:0;font-size:24px}.qty span{font-size:22px;font-weight:900;min-width:28px;text-align:center}
.form-actions{display:grid;gap:9px;margin-top:16px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#111827;color:#fff;border-radius:15px;padding:15px;display:none;text-align:center;z-index:50;box-shadow:0 12px 35px rgba(0,0,0,.25)}.toast.show{display:block}
.loading{text-align:center;color:var(--muted);padding:22px 5px}
@media(min-width:600px){.app{padding-top:30px}.modal{align-items:center}.sheet{border-radius:24px;max-height:90vh;width:520px}}
</style>
</head>
<body>
<main class="app">
<header class="header">
<div class="title">📦 Materiais Aldeia</div>
<div class="subtitle">Controle de retirada e devolução</div>
</header>

<section class="card">
<div class="stats">
<div class="stat"><span>Disponíveis</span><b id="available">—</b></div>
<div class="stat"><span>Em uso</span><b id="inuse">—</b></div>
</div>
<div class="actions">
<button class="green" id="withdraw">🟢 Retirar material</button>
<button class="blue" id="return">🔵 Devolver material</button>
<button class="gray" id="refresh">📋 Atualizar estoque</button>
</div>
</section>

<section class="card">
<div class="section-title">Estoque atual</div>
<div id="list" class="list"><div class="loading">Carregando...</div></div>
</section>
</main>

<div id="modal" class="modal" aria-hidden="true">
<div class="sheet">
<button class="close" id="close" aria-label="Fechar">×</button>
<h2 id="modalTitle">Retirar material</h2>
<label for="name">Seu nome</label>
<input id="name" class="field" autocomplete="name" autocapitalize="words" placeholder="Ex.: João">
<label for="item">Material</label>
<select id="item" class="field"></select>
<label>Quantidade</label>
<div class="qty">
<button class="gray" id="minus" aria-label="Diminuir">−</button>
<span id="qty">1</span>
<button class="gray" id="plus" aria-label="Aumentar">+</button>
</div>
<div class="form-actions">
<button class="green" id="confirm">Confirmar</button>
<button class="gray" id="cancel">Cancelar</button>
</div>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
const API="https://axcrdtvtrecjhbqazdei.supabase.co/functions/v1/aldeia-app";
let items=[],mode="",qty=1;

async function call(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok||d.error)throw new Error(d.error||"Não foi possível concluir.");
  return d;
}
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function load(){
  const list=document.getElementById("list");list.innerHTML='<div class="loading">Atualizando estoque...</div>';
  try{
    const d=await call({action:"inventory"});items=d.items||[];
    let av=0,iu=0;
    items.forEach(x=>{av+=Number(x.available);iu+=Number(x.total_quantity)-Number(x.available)});
    document.getElementById("available").textContent=av;
    document.getElementById("inuse").textContent=iu;
    list.innerHTML=items.map(x=>{
      const n=Number(x.available);
      return '<div class="row"><div class="name"><strong>'+esc(x.name)+'</strong><small>Total: '+x.total_quantity+'</small></div><div class="stock '+(n?"ok":"zero")+'">'+n+'</div></div>';
    }).join("")||'<div class="loading">Nenhum material cadastrado.</div>';
  }catch(e){list.innerHTML='<div class="loading">Não foi possível carregar o estoque.<br>Verifique sua conexão e tente novamente.</div>';}
}
function openModal(m){
  mode=m;qty=1;document.getElementById("qty").textContent="1";
  document.getElementById("modalTitle").textContent=m==="retirada"?"🟢 Retirar material":"🔵 Devolver material";
  const s=document.getElementById("item");s.innerHTML="";
  items.filter(x=>m==="retirada"?Number(x.available)>0:(Number(x.total_quantity)-Number(x.available))>0).forEach(x=>{
    const o=document.createElement("option"),max=m==="retirada"?Number(x.available):Number(x.total_quantity)-Number(x.available);
    o.value=x.id;o.dataset.max=max;o.textContent=x.name+" — disponível: "+max;s.appendChild(o);
  });
  if(!s.options.length){showToast(m==="retirada"?"Nenhum material disponível.":"Nenhum material em uso para devolver.");return;}
  document.getElementById("modal").classList.add("open");document.getElementById("modal").setAttribute("aria-hidden","false");
  setTimeout(()=>document.getElementById("name").focus(),120);
}
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modal").setAttribute("aria-hidden","true")}
function changeQty(n){const o=document.getElementById("item").selectedOptions[0],max=Number(o?.dataset.max||1);qty=Math.min(max,Math.max(1,qty+n));document.getElementById("qty").textContent=qty}
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>x.classList.remove("show"),2600)}
document.getElementById("withdraw").onclick=()=>openModal("retirada");
document.getElementById("return").onclick=()=>openModal("devolucao");
document.getElementById("refresh").onclick=load;
document.getElementById("close").onclick=closeModal;
document.getElementById("cancel").onclick=closeModal;
document.getElementById("minus").onclick=()=>changeQty(-1);
document.getElementById("plus").onclick=()=>changeQty(1);
document.getElementById("item").onchange=()=>{qty=1;document.getElementById("qty").textContent="1"};
document.getElementById("confirm").onclick=async()=>{
  const name=document.getElementById("name").value.trim(),item=document.getElementById("item").value;
  if(!name||!item){showToast("Preencha seu nome e o material.");return}
  const btn=document.getElementById("confirm");btn.disabled=true;btn.textContent="Salvando...";
  try{
    await call({action:"movement",name,item_id:Number(item),movement:mode,quantity:qty});
    closeModal();document.getElementById("name").value="";
    showToast(mode==="retirada"?"✅ Retirada registrada!":"✅ Devolução registrada!");
    await load();
  }catch(e){showToast("❌ "+e.message)}
  finally{btn.disabled=false;btn.textContent="Confirmar"}
};
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
load();
</script>
</body>
</html>
