<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><meta name="apple-mobile-web-app-title" content="Materiais Manutenção da Aldeia"><meta name="application-name" content="Materiais Manutenção da Aldeia"><title>Materiais Manutenção da Aldeia</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#718096;--line:#e7ebef;--green:#16a34a;--blue:#2563eb;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{width:min(560px,100%);margin:auto;padding:24px 16px 30px}.title{font-size:28px;font-weight:900}.sub{color:var(--muted);margin:4px 0 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 10px 30px #0f172a12;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f9fa;border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:25px}
.actions{display:grid;gap:10px;margin-top:14px}button{border:0;border-radius:15px;padding:16px;font-weight:800;min-height:52px;font-size:16px}.green{background:var(--green);color:#fff}.blue{background:var(--blue);color:#fff}.gray{background:#edf1f4;color:#26323d}.plus-btn:disabled{background:#d9dee3;color:#a5adb5;opacity:1;cursor:not-allowed}
.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:14px}.ok{color:var(--green);font-weight:900}.zero{color:var(--red);font-weight:900}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:92dvh;overflow:auto}
h2{margin:0 0 12px}.close{float:right;width:42px;height:42px;min-height:42px;border-radius:50%;padding:0;background:#edf1f4}.field{width:100%;height:54px;border:1px solid #d7dee5;border-radius:13px;padding:0 14px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}.qty{display:flex;align-items:center;gap:14px;margin:8px 0 18px}.qty button{width:52px;padding:0}.qty span{font-size:22px;font-weight:900;min-width:28px;text-align:center}
.form{display:grid;gap:9px}.toast{position:fixed;left:14px;right:14px;bottom:14px;background:#111827;color:#fff;border-radius:15px;padding:15px;text-align:center;display:none;z-index:30}.toast.show{display:block}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px;width:520px}}
</style></head><body>
<main class="app"><div class="title">📦 Materiais Manutenção da Aldeia</div><div class="sub">Controle de materiais</div>
<section class="card"><div class="stats"><div class="stat"><span>Disponíveis</span><b id="av">—</b></div><div class="stat"><span>Em uso</span><b id="iu">—</b></div></div>
<div class="actions"><button class="green" onclick="openMove('retirada')">🟢 Retirar material</button><button class="blue" onclick="openMove('devolucao')">🔵 Devolver material</button><button class="gray" onclick="load()">📋 Atualizar estoque</button></div></section>
<section class="card"><b>Estoque atual</b><div id="list" class="list">Carregando...</div></section></main>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="title"></h2>
<label>Quem é você?</label><select id="person" class="field" onchange="personChanged()"></select>
<label>Materiais <span style="font-weight:600;color:#718096">(selecione um ou mais)</span></label><div id="materials" class="list"></div>
<div class="form"><button class="green" id="confirm" onclick="submitMove()">Confirmar</button><button class="gray" onclick="closeModal()">Cancelar</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API="https://axcrdtvtrecjhbqazdei.supabase.co/functions/v1/aldeia-app2";let items=[],people=[],mode="",mine=[],selected={};
async function call(b){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"Erro");return d}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),2600)}
async function load(){try{let d=await call({action:"inventory"});items=d.items||[];let a=0,u=0;items.forEach(x=>{a+=+x.available;u+=+x.total_quantity-+x.available});av.textContent=a;iu.textContent=u;list.innerHTML=items.map(x=>'<div class="row"><span>'+x.name+'</span><b class="'+(+x.available?'ok':'zero')+'">'+x.available+'</b></div>').join("");let p=await call({action:"people"});people=p.people||[]}catch(e){list.textContent="Não foi possível carregar o estoque."}}
async function openMove(m){mode=m;selected={};title.textContent=m==="retirada"?"🟢 Retirar material":"🔵 Devolver material";person.innerHTML='<option value="">Carregando nomes...</option>';materials.innerHTML='<div class="row">Carregando...</div>';document.getElementById("modal").classList.add("open");if(m==="retirada"){person.innerHTML='<option value="">Selecione seu nome</option>'+people.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("")}else{try{let holders=[];for(const p of people){let d=await call({action:"mine",person_id:p.id});if((d.items||[]).length)holders.push(p)}person.innerHTML='<option value="">Selecione quem retirou</option>'+holders.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");if(!holders.length)materials.innerHTML='<div class="row">Nenhum material está em uso.</div>'}catch(e){toast("❌ "+e.message);person.innerHTML='<option value="">Não foi possível carregar</option>'}}}
async function personChanged(){selected={};let pid=+person.value;if(!pid){materials.innerHTML='<div class="row">Selecione um nome para continuar.</div>';return}try{let arr;if(mode==="devolucao"){let d=await call({action:"mine",person_id:pid});arr=d.items||[]}else{arr=items.filter(x=>+x.available>0).map(x=>({id:x.id,name:x.name,quantity:x.available}))}renderMaterials(arr)}catch(e){toast("❌ "+e.message)}}
function renderMaterials(arr){if(!arr.length){materials.innerHTML='<div class="row">Nenhum material disponível para esta ação.</div>';return}materials.innerHTML=arr.map(x=>'<div class="row" data-material-id="'+x.id+'" style="display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px"><input type="checkbox" style="width:22px;height:22px" onchange="toggleMaterial('+x.id+','+x.quantity+',this.checked)"><div><b>'+x.name+'</b><div id="avail'+x.id+'" style="font-size:12px;color:#718096">'+(mode==="retirada"?"Disponível: ":"Em seu nome: ")+x.quantity+'</div></div><div style="display:flex;align-items:center;gap:6px"><button class="gray" style="min-height:40px;width:40px;padding:0" id="minus'+x.id+'" onclick="changeMaterialQty('+x.id+',-1)" disabled>−</button><span id="mq'+x.id+'" style="min-width:20px;text-align:center;font-weight:900">0</span><button class="gray plus-btn" style="min-height:40px;width:40px;padding:0" id="plus'+x.id+'" onclick="changeMaterialQty('+x.id+',1)">+</button></div></div>').join("")}
function toggleMaterial(id,max,on){if(on){selected[id]={quantity:max,max};}else{delete selected[id];}updateMaterialDisplay(id)}
function changeMaterialQty(id,n){let row=document.querySelector('[data-material-id="'+id+'"]');if(!row)return;let cb=row.querySelector('input[type="checkbox"]');let max=selected[id]?.max;if(max==null){let info=items.find(x=>+x.id===+id);max=info?.available;if(max==null)return;selected[id]={quantity:0,max}}let current=selected[id]?.quantity||0;let next=Math.min(max,Math.max(0,current+n));if(next===0){delete selected[id]}else{selected[id].quantity=next}if(cb)cb.checked=next>0;updateMaterialDisplay(id)}
function updateMaterialDisplay(id){let el=document.getElementById("mq"+id);if(!el)return;let q=selected[id]?.quantity||0;el.textContent=q;let info=document.getElementById("avail"+id);if(info){let max=selected[id]?.max;info.textContent=(mode==="retirada"?"Disponível: ":"Em seu nome: ")+(max!=null?max-q:(q||0))}let plus=document.getElementById("plus"+id),minus=document.getElementById("minus"+id);if(plus)plus.disabled=selected[id]?q>=selected[id].max:false;if(minus)minus.disabled=!selected[id]||q<=0}
async function submitMove(){let pid=+person.value,chosen=Object.entries(selected);if(!pid){toast("Selecione seu nome.");return}if(!chosen.length){toast("Selecione pelo menos um material.");return}let b=document.getElementById("confirm");b.disabled=true;b.textContent="Salvando...";try{for(const [id,v] of chosen){await call({action:"movement",person_id:pid,item_id:+id,movement:mode,quantity:v.quantity})}closeModal();toast(mode==="retirada"?"✅ Retirada registrada!":"✅ Devolução registrada!");await load()}catch(e){toast("❌ "+e.message)}finally{b.disabled=false;b.textContent="Confirmar"}}
function closeModal(){document.getElementById("modal").classList.remove("open")}
load();
</script></body></html>
