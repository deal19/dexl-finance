<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><meta name="apple-mobile-web-app-title" content="Materiais Manutenção da Aldeia"><meta name="application-name" content="Materiais Manutenção da Aldeia"><title>Materiais Manutenção da Aldeia</title><!-- deploy 2026-09-22-1929 -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#718096;--line:#e7ebef;--green:#16a34a;--blue:#2563eb;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{width:min(560px,100%);margin:auto;padding:24px 16px 30px}.title{font-size:28px;font-weight:900}.sub{color:var(--muted);margin:4px 0 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 10px 30px #0f172a12;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f9fa;border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:25px}
.actions{display:grid;gap:10px;margin-top:14px}button{border:0;border-radius:15px;padding:16px;font-weight:800;min-height:52px;font-size:16px}.green{background:var(--green);color:#fff}.blue{background:var(--blue);color:#fff}.gray{background:#edf1f4;color:#26323d}.plus-btn:disabled{background:#d9dee3;color:#a5adb5;opacity:1;cursor:not-allowed}
.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:14px}.holder{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fafbfc}.holder-name{font-weight:900;margin-bottom:7px}.holder-item{display:flex;justify-content:space-between;padding:4px 0;color:#4a5568;font-size:14px}.holder-item b{color:#17202a}.ok{color:var(--green);font-weight:900}.zero{color:var(--red);font-weight:900}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:92dvh;overflow:auto}
h2{margin:0 0 12px}.close{float:right;width:42px;height:42px;min-height:42px;border-radius:50%;padding:0;background:#edf1f4}.field{width:100%;height:54px;border:1px solid #d7dee5;border-radius:13px;padding:0 14px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}.qty{display:flex;align-items:center;gap:14px;margin:8px 0 18px}.qty button{width:52px;padding:0}.qty span{font-size:22px;font-weight:900;min-width:28px;text-align:center}
.form{display:grid;gap:9px}.toast{position:fixed;left:14px;right:14px;bottom:14px;background:#111827;color:#fff;border-radius:15px;padding:15px;text-align:center;display:none;z-index:30}.toast.show{display:block}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px;width:520px}}
</style></head><body>
<main class="app"><div class="title">📦 Materiais Manutenção da Aldeia</div><div class="sub">Controle de materiais</div>
<section class="card"><div class="stats"><div class="stat"><span>Disponíveis</span><b id="av">—</b></div><div class="stat"><span>Em uso</span><b id="iu">—</b></div></div>
<div class="actions"><button class="green" onclick="openMove('retirada')">🟢 Retirar material</button><button class="blue" onclick="openMove('devolucao')">🔵 Devolver material</button><button class="gray" onclick="load()">📋 Atualizar estoque</button></div></section>
<section class="card"><b>Quem está com os materiais</b><div id="holders" class="list">Carregando...</div></section><section class="card"><b>Estoque atual</b><div id="list" class="list">Carregando...</div></section></main>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="title"></h2>
<label>Quem é você?</label><select id="person" class="field" onchange="personChanged()"></select>
<label>Materiais <span style="font-weight:600;color:#718096">(selecione um ou mais)</span></label><div id="materials" class="list"></div>
<div class="form"><button class="green" id="confirm" onclick="submitMove()">Confirmar</button><button class="gray" onclick="closeModal()">Cancelar</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API="https://axcrdtvtrecjhbqazdei.supabase.co/functions/v1/aldeia-app2";
const SB_KEY="sb_publishable_1ab3cxUxf_K7_jqNuRahvQ_d7O2m0kS";
let items=[], people=[], mode="", selected={};

const $=id=>document.getElementById(id);

async function api(data){
  const headers={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
  let response;
  if(data.action==="movement"){
    response=await fetch(API,{method:"POST",headers:headers,body:JSON.stringify(data),cache:"no-store"});
  }else{
    const q=new URLSearchParams();
    Object.keys(data).forEach(k=>q.set(k,String(data[k])));
    response=await fetch(API+"?"+q.toString(),{method:"GET",headers:headers,cache:"no-store"});
  }
  const raw=await response.text();
  let json;
  try{json=JSON.parse(raw)}catch(e){throw new Error("API respondeu de forma inválida ("+response.status+")")}
  if(!response.ok||json.error)throw new Error(json.error||"Erro HTTP "+response.status);
  return json;
}

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),3000);
}

function renderInventory(){
  let available=0,inUse=0;
  items.forEach(x=>{
    available+=Number(x.available)||0;
    inUse+=(Number(x.total_quantity)||0)-(Number(x.available)||0);
  });
  $("av").textContent=available;
  $("iu").textContent=inUse;
  if(!items.length){
    $("list").innerHTML='<div class="row">Nenhum material cadastrado.</div>';
    return;
  }
  $("list").innerHTML=items.map(x=>{
    const q=Number(x.available)||0;
    return '<div class="row"><span>'+x.name+'</span><b class="'+(q?"ok":"zero")+'">'+q+'</b></div>';
  }).join("");
}

async function loadHolders(){
  try{
    const data=await api({action:"holders"});
    const holders=data.holders||[];
    if(!holders.length){
      $("holders").innerHTML='<div class="row">Nenhum material está em uso.</div>';
      return;
    }
    $("holders").innerHTML=holders.map(h=>
      '<div class="holder"><div class="holder-name">👤 '+h.person.name+'</div>'+
      (h.items||[]).map(i=>'<div class="holder-item"><span>'+i.name+'</span><b>'+i.quantity+' un.</b></div>').join("")+
      '</div>'
    ).join("");
  }catch(e){
    $("holders").innerHTML='<div class="row">Erro ao carregar: '+e.message+'</div>';
  }
}

async function load(){
  $("list").textContent="Carregando...";
  $("holders").textContent="Carregando...";
  try{
    const inv=await api({action:"inventory"});
    items=inv.items||[];
    renderInventory();
    const ppl=await api({action:"people"});
    people=ppl.people||[];
    await loadHolders();
  }catch(e){
    console.error(e);
    $("av").textContent="!";
    $("iu").textContent="!";
    $("list").innerHTML='<div class="row">Erro ao carregar estoque: '+e.message+'</div>';
    $("holders").innerHTML='<div class="row">Erro ao carregar: '+e.message+'</div>';
  }
}

async function openMove(action){
  mode=action;
  selected={};
  $("title").textContent=action==="retirada"?"🟢 Retirar material":"🔵 Devolver material";
  $("person").innerHTML='<option value="">Carregando nomes...</option>';
  $("materials").innerHTML='<div class="row">Carregando...</div>';
  $("modal").classList.add("open");
  if(action==="retirada"){
    $("person").innerHTML='<option value="">Selecione seu nome</option>'+
      people.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");
    $("materials").innerHTML='<div class="row">Selecione seu nome para continuar.</div>';
    return;
  }
  try{
    const holders=[];
    for(const p of people){
      const mine=await api({action:"mine",person_id:p.id});
      if((mine.items||[]).length)holders.push(p);
    }
    $("person").innerHTML='<option value="">Selecione quem retirou</option>'+
      holders.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");
    if(!holders.length)$("materials").innerHTML='<div class="row">Nenhum material está em uso.</div>';
    else $("materials").innerHTML='<div class="row">Selecione quem retirou.</div>';
  }catch(e){
    $("person").innerHTML='<option value="">Erro ao carregar nomes</option>';
    $("materials").innerHTML='<div class="row">Erro: '+e.message+'</div>';
  }
}

async function personChanged(){
  selected={};
  const pid=Number($("person").value);
  if(!pid){
    $("materials").innerHTML='<div class="row">Selecione um nome para continuar.</div>';
    return;
  }
  try{
    let arr=[];
    if(mode==="devolucao"){
      const data=await api({action:"mine",person_id:pid});
      arr=data.items||[];
    }else{
      arr=items.filter(x=>(Number(x.available)||0)>0).map(x=>({id:x.id,name:x.name,quantity:Number(x.available)}));
    }
    renderMaterials(arr);
  }catch(e){
    $("materials").innerHTML='<div class="row">Erro: '+e.message+'</div>';
  }
}

function renderMaterials(arr){
  if(!arr.length){
    $("materials").innerHTML='<div class="row">Nenhum material disponível para esta ação.</div>';
    return;
  }

  $("materials").innerHTML=arr.map(x=>{
    const id=Number(x.id), max=Number(x.quantity)||0;
    return '<div class="row material-row" data-material-id="'+id+'" data-max="'+max+'" style="display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px">'+
      '<input class="material-check" type="checkbox" data-id="'+id+'" style="width:22px;height:22px">'+
      '<div><b>'+x.name+'</b><div id="avail'+id+'" style="font-size:12px;color:#718096">'+
      (mode==="retirada"?"Disponível: ":"Em seu nome: ")+max+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:6px">'+
      '<button type="button" class="gray qty-minus" data-id="'+id+'" style="min-height:40px;width:40px;padding:0" disabled>−</button>'+
      '<span id="mq'+id+'" style="min-width:20px;text-align:center;font-weight:900">0</span>'+
      '<button type="button" class="gray plus-btn qty-plus" data-id="'+id+'" style="min-height:40px;width:40px;padding:0">+</button>'+
      '</div></div>';
  }).join("");

  // Eventos ficam registrados diretamente no painel. Isso evita falhas de
  // onclick/onchange no Safari/iPhone e mantém checkbox, quantidade e botões sincronizados.
  $("materials").querySelectorAll(".material-check").forEach(check=>{
    check.addEventListener("change",()=>{
      const id=Number(check.dataset.id);
      const row=check.closest(".material-row");
      const max=Number(row.dataset.max)||0;
      if(check.checked && max>0) selected[id]={quantity:1,max:max};
      else delete selected[id];
      updateMaterialDisplay(id);
    });
  });

  $("materials").querySelectorAll(".qty-plus").forEach(btn=>{
    btn.addEventListener("click",()=>{
      changeMaterialQty(Number(btn.dataset.id),1);
    });
  });

  $("materials").querySelectorAll(".qty-minus").forEach(btn=>{
    btn.addEventListener("click",()=>{
      changeMaterialQty(Number(btn.dataset.id),-1);
    });
  });
}

function changeMaterialQty(id,delta){
  const row=document.querySelector('[data-material-id="'+id+'"]');
  if(!row)return;

  const checkbox=row.querySelector(".material-check");
  const max=Number(row.dataset.max)||0;
  if(!max)return;

  let data=selected[id];

  // Tocar no + em um item ainda não selecionado também seleciona o item e começa em 1.
  if(!data){
    if(delta<=0)return;
    selected[id]={quantity:1,max:max};
    checkbox.checked=true;
    updateMaterialDisplay(id);
    return;
  }

  const next=Math.min(data.max,Math.max(0,data.quantity+delta));

  if(next<=0){
    delete selected[id];
    checkbox.checked=false;
  }else{
    data.quantity=next;
    checkbox.checked=true;
  }

  updateMaterialDisplay(id);
}

function updateMaterialDisplay(id){
  const row=document.querySelector('[data-material-id="'+id+'"]');
  if(!row)return;

  const q=selected[id]?.quantity||0;
  const max=Number(row.dataset.max)||0;
  const qty=$("#mq"+id);
  const info=$("#avail"+id);
  const plus=row.querySelector(".qty-plus");
  const minus=row.querySelector(".qty-minus");

  if(qty)qty.textContent=q;

  // Mostra quanto ainda pode ser selecionado.
  if(info)info.textContent=(mode==="retirada"?"Disponível: ":"Em seu nome: ")+(max-q);

  if(plus){
    plus.disabled=!selected[id] || q>=max;
    plus.setAttribute("aria-disabled",String(plus.disabled));
  }

  if(minus){
    minus.disabled=!selected[id] || q<=0;
    minus.setAttribute("aria-disabled",String(minus.disabled));
  }
}

async function submitMove(){
  const pid=Number($("person").value);
  const chosen=Object.entries(selected);
  if(!pid){toast("Selecione a pessoa.");return;}
  if(!chosen.length){toast("Selecione pelo menos um material.");return;}
  const button=$("confirm");
  button.disabled=true;
  button.textContent="Salvando...";
  try{
    for(const [id,v] of chosen){
      await api({action:"movement",person_id:pid,item_id:Number(id),movement:mode,quantity:v.quantity});
    }
    closeModal();
    toast(mode==="retirada"?"✅ Retirada registrada!":"✅ Devolução registrada!");
    await load();
  }catch(e){
    toast("❌ "+e.message);
  }finally{
    button.disabled=false;
    button.textContent="Confirmar";
  }
}

function closeModal(){$("modal").classList.remove("open")}

window.addEventListener("DOMContentLoaded",load);
</script></body></html>
