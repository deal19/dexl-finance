<meta name="theme-color" content="#0b0f14"><meta name="apple-mobile-web-app-title" content="Materiais Manutenção da Aldeia"><meta name="application-name" content="Materiais Manutenção da Aldeia"><title>Materiais Manutenção da Aldeia</title>
<style>
:root{--bg:#edf5e7;--card:rgba(255,255,255,.94);--text:#1d3b21;--muted:#6d806e;--line:#dfe9d8;--green:#16a34a;--blue:#2563eb;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;opacity:.2;background:radial-gradient(ellipse 180px 420px at 8% 20%,#cbdcc2 0 42%,transparent 43%),radial-gradient(ellipse 150px 360px at 93% 42%,#d5e3cc 0 42%,transparent 43%),radial-gradient(ellipse 120px 300px at 18% 82%,#d3e2ca 0 42%,transparent 43%),radial-gradient(ellipse 180px 420px at 82% 88%,#d0dfc7 0 42%,transparent 43%);transform:rotate(-18deg)}
.app{width:min(560px,100%);margin:auto;padding:26px 16px 34px}.brand{text-align:center;margin:0 auto 22px}.brand-logo{display:block;width:min(230px,62vw);height:auto;margin:0 auto 10px;filter:drop-shadow(0 8px 14px rgba(39,72,39,.08))}.title{font-size:28px;line-height:1.12;font-weight:900;letter-spacing:-.5px;color:#244c29}.sub{color:#4f8d57;margin:7px 0 0;font-size:15px;font-weight:800;letter-spacing:.8px}
.card{background:var(--card);border:1px solid rgba(205,220,199,.8);border-radius:22px;padding:17px;box-shadow:0 12px 32px rgba(38,72,40,.08);margin-bottom:14px;backdrop-filter:blur(5px)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f9fa;border-radius:16px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{font-size:25px}
.actions{display:grid;gap:10px;margin-top:14px}button{border:0;border-radius:15px;padding:16px;font-weight:800;min-height:52px;font-size:16px}.green{background:var(--green);color:#fff}.blue{background:var(--blue);color:#fff}.gray{background:#edf1f4;color:#26323d}.plus-btn:disabled{background:#d9dee3;color:#a5adb5;opacity:1;cursor:not-allowed}
.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:14px}.holder{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fafbfc}.holder-name{font-weight:900;margin-bottom:7px}.holder-item{display:flex;justify-content:space-between;padding:4px 0;color:#4a5568;font-size:14px}.holder-item b{color:#17202a}.ok{color:var(--green);font-weight:900}.zero{color:var(--red);font-weight:900}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:92dvh;overflow:auto}
h2{margin:0 0 12px}.close{float:right;width:42px;height:42px;min-height:42px;border-radius:50%;padding:0;background:#edf1f4}.field{width:100%;height:54px;border:1px solid #d7dee5;border-radius:13px;padding:0 14px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:800;margin:13px 0 6px}.qty{display:flex;align-items:center;gap:14px;margin:8px 0 18px}.qty button{width:52px;padding:0}.qty span{font-size:22px;font-weight:900;min-width:28px;text-align:center}
.form{display:grid;gap:9px}.toast{position:fixed;left:14px;right:14px;bottom:14px;background:#111827;color:#fff;border-radius:15px;padding:15px;text-align:center;display:none;z-index:30}.toast.show{display:block}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px;width:520px}}

<section class="card"><div class="stats"><div class="stat"><span>Disponíveis</span><b id="av">—</b></div><div class="stat"><span>Em uso</span><b id="iu">—</b></div></div>
<div class="actions"><button class="green" onclick="openMove('retirada')">🟢 Retirar material</button><button class="blue" onclick="openMove('devolucao')">🔵 Devolver material</button><button class="gray" onclick="load()">📋 Atualizar estoque</button></div></section>
<section class="card"><b>Quem está com os materiais</b><div id="holders" class="list">Carregando...</div></section><section class="card"><b>Estoque atual</b><div id="list" class="list">Carregando...</div></section></main>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="title"></h2>
<label>Quem é você?</label><select id="person" class="field" onchange="personChanged()"></select>
<label>Materiais <span style="font-weight:600;color:#718096">(selecione um ou mais)</span></label><div id="materials" class="list"></div>
<div class="form"><button class="green" id="confirm" onclick="submitMove()">Confirmar</button><button class="gray" onclick="closeModal()">Cancelar</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API="https://axcrdtvtrecjhbqazdei.supabase.co/functions/v1/aldeia-app2";const SB_KEY="sb_publishable_1ab3cxUxf_K7_jqNuRahvQ_d7O2m0kS";let items=[],people=[],mode="",mine=[],selected={};
async function call(b){const headers={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};let r;if(b.action==="movement"){r=await fetch(API,{method:"POST",headers,body:JSON.stringify(b),cache:"no-store"})}else{const q=new URLSearchParams();Object.entries(b).forEach(([k,v])=>q.set(k,String(v)));r=await fetch(API+"?"+q.toString(),{method:"GET",headers,cache:"no-store"})}const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error("Resposta inválida da API ("+r.status+")")}if(!r.ok||d.error)throw Error(d.error||"Erro");return d}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),2600)}
async function load(){try{let d=await call({action:"inventory"});items=d.items||[];let a=0,u=0;items.forEach(x=>{a+=+x.available;u+=+x.total_quantity-+x.available});av.textContent=a;iu.textContent=u;list.innerHTML=items.map(x=>'<div class="row"><span>'+x.name+'</span><b class="'+(+x.available?'ok':'zero')+'">'+x.available+'</b></div>').join("");let p=await call({action:"people"});people=p.people||[];await loadHolders()}catch(e){list.textContent="Não foi possível carregar o estoque.";holders.textContent="Não foi possível carregar quem está com os materiais."}}
async function loadHolders(){try{let data=await Promise.all(people.map(async p=>({person:p,items:(await call({action:"mine",person_id:p.id})).items||[]})));let active=data.filter(x=>x.items.length);if(!active.length){holders.innerHTML='<div class="row">Nenhum material está em uso.</div>';return}holders.innerHTML=active.map(x=>'<div class="holder"><div class="holder-name">👤 '+x.person.name+'</div>'+x.items.map(i=>'<div class="holder-item"><span>'+i.name+'</span><b>'+i.quantity+' un.</b></div>').join("")+'</div>').join("")}catch(e){holders.innerHTML='<div class="row">Não foi possível carregar quem está com os materiais.</div>'}}
async function openMove(m){mode=m;selected={};title.textContent=m==="retirada"?"🟢 Retirar material":"🔵 Devolver material";person.innerHTML='<option value="">Carregando nomes...</option>';materials.innerHTML='<div class="row">Carregando...</div>';document.getElementById("modal").classList.add("open");if(m==="retirada"){person.innerHTML='<option value="">Selecione seu nome</option>'+people.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("")}else{try{let holders=[];for(const p of people){let d=await call({action:"mine",person_id:p.id});if((d.items||[]).length)holders.push(p)}person.innerHTML='<option value="">Selecione quem retirou</option>'+holders.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");if(!holders.length)materials.innerHTML='<div class="row">Nenhum material está em uso.</div>'}catch(e){toast("❌ "+e.message);person.innerHTML='<option value="">Não foi possível carregar</option>'}}}
async function personChanged(){selected={};let pid=+person.value;if(!pid){materials.innerHTML='<div class="row">Selecione um nome para continuar.</div>';return}try{let arr;if(mode==="devolucao"){let d=await call({action:"mine",person_id:pid});arr=d.items||[]}else{arr=items.filter(x=>+x.available>0).map(x=>({id:x.id,name:x.name,quantity:x.available}))}renderMaterials(arr)}catch(e){toast("❌ "+e.message)}}
function renderMaterials(arr){if(!arr.length){materials.innerHTML='<div class="row">Nenhum material disponível para esta ação.</div>';return}const bulk=mode==="devolucao"?'<label style="display:flex;align-items:center;gap:10px;padding:13px 14px;margin-bottom:10px;border:1px solid #dfe8dc;border-radius:14px;background:#f7fbf5;font-weight:800;color:#244b2b"><input id="returnAll" type="checkbox" style="width:22px;height:22px" onchange="toggleReturnAll(this.checked)">↩️ Devolver tudo</label>':'';materials.innerHTML=bulk+arr.map(x=>'<div class="row" data-material-id="'+x.id+'" data-max="'+x.quantity+'" style="display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px"><input type="checkbox" style="width:22px;height:22px" onchange="toggleMaterial('+x.id+','+x.quantity+',this.checked)"><div><b>'+x.name+'</b><div id="avail'+x.id+'" style="font-size:12px;color:#718096">'+(mode==="retirada"?"Disponível: ":"Em seu nome: ")+x.quantity+'</div></div><div style="display:flex;align-items:center;gap:6px"><button class="gray" style="min-height:40px;width:40px;padding:0" id="minus'+x.id+'" onclick="changeMaterialQty('+x.id+',-1)" disabled>−</button><span id="mq'+x.id+'" style="min-width:20px;text-align:center;font-weight:900">0</span><button class="gray plus-btn" style="min-height:40px;width:40px;padding:0" id="plus'+x.id+'" onclick="changeMaterialQty('+x.id+',1)">+</button></div></div>').join("")}
function toggleReturnAll(on){document.querySelectorAll('[data-material-id]').forEach(row=>{const id=Number(row.dataset.materialId);const max=Number(row.dataset.max)||0;const cb=row.querySelector('input[type="checkbox"]');if(on&&max>0){selected[id]={quantity:max,max:max};if(cb)cb.checked=true}else{delete selected[id];if(cb)cb.checked=false}updateMaterialDisplay(id)})}
function toggleMaterial(id,max,on){const n=Number(max)||0;if(on&&n>0){selected[id]={quantity:n,max:n}}else{delete selected[id]}updateMaterialDisplay(id)}
function changeMaterialQty(id,n){let row=document.querySelector('[data-material-id="'+id+'"]');if(!row)return;let cb=row.querySelector('input[type="checkbox"]');let max=selected[id]?.max;if(max==null){max=Number(row.dataset.max)||0;if(max<=0)return;selected[id]={quantity:0,max}}let current=selected[id]?.quantity||0;let next=Math.min(max,Math.max(0,current+n));if(next===0){delete selected[id]}else{selected[id].quantity=next}if(cb)cb.checked=next>0;updateMaterialDisplay(id)}
function updateMaterialDisplay(id){let el=document.getElementById("mq"+id);if(!el)return;let q=selected[id]?.quantity||0;el.textContent=q;let info=document.getElementById("avail"+id);if(info){let row=document.querySelector('[data-material-id="'+id+'"]');let max=selected[id]?.max ?? (Number(row?.dataset.max)||0);info.textContent=(mode==="retirada"?"Disponível: ":"Em seu nome: ")+(max-q)}let plus=document.getElementById("plus"+id),minus=document.getElementById("minus"+id);if(plus)plus.disabled=selected[id]?q>=selected[id].max:false;if(minus)minus.disabled=!selected[id]||q<=0}
async function submitMove(){let pid=+person.value,chosen=Object.entries(selected);if(!pid){toast("Selecione seu nome.");return}if(!chosen.length){toast("Selecione pelo menos um material.");return}let b=document.getElementById("confirm");b.disabled=true;b.textContent="Salvando...";try{for(const [id,v] of chosen){await call({action:"movement",person_id:pid,item_id:+id,movement:mode,quantity:v.quantity})}closeModal();toast(mode==="retirada"?"✅ Retirada registrada!":"✅ Devolução registrada!");await load()}catch(e){toast("❌ "+e.message)}finally{b.disabled=false;b.textContent="Confirmar"}}
function closeModal(){document.getElementById("modal").classList.remove("open")}
load();
</script></body></html>
